name: Validate plugin release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check published JavaScript syntax
        run: |
          cp plugin/plugin.js "$RUNNER_TEMP/plugin.mjs"
          node --check "$RUNNER_TEMP/plugin.mjs"
